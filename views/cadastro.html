<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/img/estrela.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/tema-inicial.js"></script>
  <title>Criar conta | CineManas</title>
</head>
<body class="zebra">
  <main class="pagina-central">
    <section class="coluna">
      <div class="avatar grande" aria-hidden="true"></div>
      <form id="form-cadastro" class="formulario" novalidate>
        <label for="nome">Nome</label>
        <input class="campo" type="text" id="nome" name="nome" placeholder="Ex: Ana Clara" autocomplete="name" maxlength="100" required />
        <label for="email">E-mail</label>
        <input class="campo" type="email" id="email" name="email" placeholder="Ex: princesadoOneDirection@gmail.com" autocomplete="email" required />
        <label for="senha">Senha</label>
        <input class="campo" type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required />
        <button class="botao-acessar" type="submit">Criar conta</button>
        <p class="mensagem" id="mensagem" role="alert"></p>
        <p class="link-rodape">Já tem conta? <a href="/login">Entrar</a></p>
      </form>
    </section>
  </main>
  <script src="/js/comum.js"></script>
  <script src="/js/cadastro.js"></script>
</body>
</html>
